[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "snmpsim-ng"
version = "2026.11.7"
description = "SNMP Simulator is a tool that acts as multitude of SNMP Agents built into real physical devices, from SNMP Manager's point of view. Simulator builds and uses a database of physical devices' SNMP footprints to respond like their original counterparts do."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "BSD-2-Clause" }
license-files = ["LICENSE.txt"]
authors = [
    { name = "Ilya Etingof", email = "etingof@gmail.com" },
    { name = "LeXtudio Inc.", email = "support@lextudio.com" },
]
maintainers = [
    { name = "Mikhail Stupalov" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Communications",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    # 7.1.31 is the last for Python 3.10, later ones need 3.11; what keeps
    # BER decoding safe is the pyasn1 below, which 7.1.31 works with
    "pysnmp>=7.1.31,<8.0.0",
    # imported directly, not only through pysnmp; 0.6.5 has the last of the
    # decoder fixes (GHSA-mm57-4v3p-rchx and the others of October 2026)
    "pyasn1>=0.6.5,<0.8.0",
    # imported by snmpsim.utils, not pulled in by pysnmp
    "pysmi>=2.0.0,<3.0.0",
    # pysnmp declares it as a dev extra only, but SNMP-USM-DH-OBJECTS-MIB
    # imports it unconditionally, so the responder cannot even start without it
    "cryptography>=44.0.1"
]

[project.urls]
Documentation = "https://observium.github.io/snmpsim/"
Repository = "https://github.com/observium/snmpsim"
Issues = "https://github.com/observium/snmpsim/issues"
Changelog = "https://github.com/observium/snmpsim/blob/master/CHANGES.rst"

[project.scripts]
snmpsim-manage-records = "snmpsim.commands.rec2rec:main"
snmpsim-record-mibs = "snmpsim.commands.mib2rec:main"
snmpsim-record-traffic = "snmpsim.commands.pcap2rec:main"
snmpsim-record-commands = "snmpsim.commands.cmd2rec:main"
snmpsim-command-responder = "snmpsim.commands.responder:main"
snmpsim-command-responder-lite = "snmpsim.commands.responder_lite:main"
snmpsim-lint-records = "snmpsim.commands.lint:main"

[tool.hatch.build.targets.wheel]
packages = ["snmpsim"]

[tool.hatch.build.targets.sdist]
include = [
    "snmpsim",
    "docs",
    "README.md",
    "CHANGES.rst",
    "THANKS.txt",
    "LICENSE.txt",
]

[project.optional-dependencies]
dev = [
    "codecov>=2.1.12,<3.0.0",
    "pytest>=7.2.0,<8.0.0",
    "pytest-asyncio>=0.21.1,<0.22.0",
    "pytest-codecov>=0.4.0,<1.0.0",
    "pytest-rerunfailures>=12.0,<13.0",
    "tomli>=2.0.1,<3.0.0; python_version<'3.11'",
    "black==23.1.0",
    "bump2version>=1.0.1",
]
docs = [
    "Sphinx>=7.0.0,<8.0.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "furo>=2024.1.1,<2025.0.0",
    "doc8>=1.1.1,<2.0.0",
    "sphinx-notfound-page>=1.0.0,<2.0.0",
]
