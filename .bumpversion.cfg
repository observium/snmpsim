[bumpversion]
current_version = 2026.11.4
commit = False
tag = False
tag_name = {new_version}
parse = (?P<year>\d{4})\.(?P<month>\d{1,2})\.(?P<patch>\d+)
serialize = {year}.{month}.{patch}

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:snmpsim/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:docs/source/conf.py]
search = release = "{current_version}"
replace = release = "{new_version}"

[bumpversion:file:CHANGES.rst]
search = .. current-version: {current_version} (managed by bump2version)
replace = .. current-version: {new_version} (managed by bump2version)
