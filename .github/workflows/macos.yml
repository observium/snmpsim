name: macOS

# GitHub's macOS runners are scarce: a job may wait for one for hours and be
# cancelled without having run. In the CI workflow, which runs on every push,
# that failed it on code that was fine, so macOS has a workflow of its own:
# for each release tag, and by hand before one. Its result says nothing about
# a push and holds none up.
on:
  push:
    tags: ["*"]
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest: runners are too scarce for all six
        python-version: ["3.10", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-asyncio

      - name: Report the DBM backend in use
        run: |
          python - <<'PY'
          from snmpsim.record.search import database
          print("index backend:", database.DBM_BACKEND.__name__)
          PY

      - name: Tests
        env:
          SNMPSIM_TEST_TIMEOUT: "3"
        run: pytest tests -q
