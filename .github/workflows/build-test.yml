name: CI

on:
  push:
    branches:
      - "master"
      # - "develop"
    paths-ignore: &docs
      - "**.md"
      - "**.rst"
      - "docs/**"
      - "LICENSE.txt"
      - "THANKS.txt"
      - "TODO.txt"
  pull_request:
    branches: [master]
    paths-ignore: *docs

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: |
          uv --version
          uv python pin ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Build
        run: uv build
      - name: Test
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: uv run python -m pytest tests --reruns 2 --reruns-delay 1 --cov=snmpsim --cov-report=term --cov-report=xml --junitxml=junit/test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml
      - name: Test summary
        uses: test-summary/action@v2
        with:
          paths: "junit/*.xml"
        if: always()
