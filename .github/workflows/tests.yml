name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-asyncio

      - name: Report the DBM backend in use
        run: |
          python - <<'PY'
          from snmpsim.record.search import database
          print("index backend:", database.DBM_BACKEND.__name__)
          PY

      - name: Tests
        env:
          # every responder test waits this out; the default of 15s just
          # makes the run slower
          SNMPSIM_TEST_TIMEOUT: "3"
        run: pytest tests -q

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install black==23.1.0

      - name: Check formatting
        run: black --check snmpsim tests
